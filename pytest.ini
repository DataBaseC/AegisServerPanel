[pytest]
# 测试环境说明见 tests/conftest.py（配置与常驻应用注册表都会被隔离到临时目录）
testpaths = tests
addopts = -q

# asyncio 子进程的管道 transport 在解释器退出阶段被 GC 回收时会打印
# "unclosed transport" 的 ResourceWarning（Windows 的 Proactor 事件循环尤其明显）。
# 这是清理噪音，不是功能回归——真正的行为由断言覆盖。这里显式忽略，
# 以免每次跑测试都被它刷屏；如果将来真的出现 fd 泄漏，用例断言会先失败。
filterwarnings =
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
