version: 2
updates:
  # 依赖更新按"一组一个 PR"收敛：原先每周会开出 5 个 pip PR + 2 个 actions PR，
  # 每个都因为没重生成 SHA256SUMS 而红叉，PR 列表被噪音淹没。
  # 分组后：minor/patch 合到一个 PR；major 仍单独开（限额 2），便于逐个评估。
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      python-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
